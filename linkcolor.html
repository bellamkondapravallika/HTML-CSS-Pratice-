<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    a:link{
        color:green;
        background-color:transparent;
        text-decoration: none;
    }
   a:visited{
        color:rgb(128, 0, 119);
        background-color:transparent;
        text-decoration: none;
    }
     a:hover{
        color:red;
        background-color:transparent;
        text-decoration: underline;
    }
     a:active{
        color:yellow;
        background-color:transparent;
        text-decoration: underline;
    }  
</style>



</head>
<body>
   <h1> Link color</h1>
   <a href="https://www.google.com/">Go to Google</a> 
</body>
</html>
